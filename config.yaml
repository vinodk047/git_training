# MQTT to IoT Hub Bridge Configuration

mqtt:
  broker_host: "localhost"
  broker_port: 1883
  username: null  # Optional MQTT username
  password: null  # Optional MQTT password
  client_id: "mqtt_iot_bridge"
  topics:
    - "sensors/#"  # Subscribe to all sensor topics
    - "devices/#"  # Subscribe to all device topics
  qos: 1
  clean_session: true
  keepalive: 60
  use_tls: false
  ca_cert_path: null  # Path to CA certificate for TLS
  client_cert_path: null  # Path to client certificate
  client_key_path: null  # Path to client key

iothub:
  connection_string: "HostName=<your-iothub>.azure-devices.net;DeviceId=<device-id>;SharedAccessKey=<key>"
  device_id: "mqtt-bridge-device"
  module_id: null  # Optional module ID
  message_timeout: 10000
  protocol: "mqtt"  # mqtt, amqp, or http

bridge:
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  message_batch_size: 1
  message_batch_timeout: 5
  enable_message_transformation: false
  transformation_script: null
  retry_enabled: true
  retry_max_attempts: 3
  retry_backoff_factor: 2
